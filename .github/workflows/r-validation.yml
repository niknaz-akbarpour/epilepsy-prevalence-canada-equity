name: Validate R analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Download and prepare official data
        run: Rscript scripts/01_download_prepare.R

      - name: Reproduce tables and figures
        run: Rscript scripts/02_analysis_visualization.R

      - name: Verify required outputs
        shell: bash
        run: |
          test -s outputs/national_latest_summary.csv
          test -s outputs/national_trend_by_sex.csv
          test -s outputs/latest_age_distribution.csv
          test -s outputs/figures/national_epilepsy_prevalence_trend.png
          test -s outputs/figures/epilepsy_prevalence_by_age_2023_24.png

